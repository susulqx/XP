name: Build Xposed Module APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: locate
        run: |
          echo "apk_dir=$(ls -d app/build/outputs/apk/release 2>/dev/null || echo app/build/outputs/apk/debug)" >> $GITHUB_OUTPUT
          echo "apk_name=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null || ls app/build/outputs/apk/debug/*.apk)" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XposedBypass-${{ github.sha }}
          path: ${{ steps.locate.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30
